# ============================================================
# PenDesk Coturn STUN & TURN Relay Configuration
# ============================================================

# Listening port for STUN/TURN (UDP & TCP)
listening-port=3478
tls-listening-port=5349

# TURN Relay UDP Port Range (Open these in VPS firewall!)
min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint
lt-cred-mech

# Authentication mechanism: Time-limited ephemeral credentials (REST API)
use-auth-secret
static-auth-secret=PENDESK_TURN_SECRET_PLACEHOLDER
realm=PENDESK_REALM_PLACEHOLDER

# Performance and resource limits
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli
no-loopback-peers
